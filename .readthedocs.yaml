# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
# ... other parts of the file ...

# ... other parts of the file ...

build:
  os: ubuntu-24.04
  tools:
    python: "3.13" # Or "3.12"
  jobs:
    pre_build:
      - | # Use a multi-line string for multiple commands
        echo "--- Debugging Environment ---"
        echo "sys.path before Sphinx build:"
        python -c "import sys; print(sys.path)"
        echo "PYTHONPATH environment variable:"
        echo $PYTHONPATH

        # Check nucleardatapy import using a Here Document
        echo "Attempting to import nucleardatapy before Sphinx build:"
        cat << EOF > check_nucleardatapy_import.py
import sys
try:
    import nucleardatapy
    print('nucleardatapy import successful')
    sys.exit(0)
except ImportError:
    print('nucleardatapy import failed: Module not found')
    sys.exit(1)
EOF
        python check_nucleardatapy_import.py
        rm check_nucleardatapy_import.py


        # Check matplotlib import using a Here Document
        echo "Attempting to import matplotlib before Sphinx build:"
        cat << EOF > check_matplotlib_import.py
import sys
try:
    import matplotlib
    print('matplotlib import successful')
    sys.exit(0)
except ImportError:
    print('matplotlib import failed: Module not found')
    sys.exit(1)
EOF
        python check_matplotlib_import.py
        rm check_matplotlib_import.py

        echo "--- End Debugging Environment ---"
# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Optionally, but recommended,
# declare the Python requirements required to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    # Install your project package from the repository root
    - method: pip
      path: .

    # Install documentation-specific requirements from a separate file
    - requirements: docs/requirements.txt

  # If your main project requirements are separate and needed for docs runtime:
  # - requirements: requirements.txt
